<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Suitability Scorer</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <style>
        :root {
            --primary-color: #e51937;
            --bg-color: #f7f9fb;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
        }
        .card {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-radius: 1rem;
            background-color: white;
        }
        .primary-btn {
            background-color: var(--primary-color);
        }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-800">Vehicle Suitability Scorer</h1>
            <p class="mt-2 text-xl text-gray-500">Find your perfect car with this interactive questionnaire.</p>
        </header>

        <main class="grid lg:grid-cols-2 gap-8">
            <!-- Questionnaire Form -->
            <div id="questionnaire" class="card p-6 md:p-8">
                <h2 class="text-2xl font-bold mb-6 text-gray-700">User Profile</h2>
                <form id="car-quiz-form" class="space-y-6">

                    <!-- Q1: Vibe Filter -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">1. What size car feels right for your needs?</label>
                        <select name="vibe" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500">
                            <option value="">-- Select a size --</option>
                            <option value="Small (ideal for 1-2, big enough for 4)">Small (ideal for 1-2, big enough for 4)</option>
                            <option value="Mid-sized (ideal for 1-4, big enough for 5)">Mid-sized (ideal for 1-4, big enough for 5)</option>
                            <option value="Large (comfortably seats 5)">Large (comfortably seats 5)</option>
                        </select>
                    </div>

                    <!-- Q2: Driving Distance Frequency (Weighted 2x) -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">2. How often do you drive long distances?</label>
                        <select name="longDistanceFrequency" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500">
                            <option value="Daily">Daily</option>
                            <option value="Weekly">Weekly</option>
                            <option value="Monthly">Monthly</option>
                            <option value="Rarely">Rarely</option>
                        </select>
                    </div>

                    <!-- Q3: Prioritise (Weighted 3x) -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">3. Above all else, you prioritise...</label>
                        <select name="prioritise" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500">
                            <option value="Design that stands out">Design that stands out</option>
                            <option value="Features and modern tech">Features and modern tech</option>
                            <option value="Comfort and space">Comfort and space</option>
                            <option value="The essentials, done right">The essentials, done right</option>
                        </select>
                    </div>

                    <!-- Q4: Typical Driving Day (Weighted 1x) -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">4. What's your typical driving day?</label>
                        <select name="drivingDay" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-red-500 focus:border-red-500">
                            <option value="City commutes and short trips">City commutes and short trips</option>
                            <option value="Always on-the-go with kids">Always on-the-go with kids</option>
                            <option value="High mileage motorway driving">High mileage motorway driving</option>
                            <option value="Light driving here and there">Light driving here and there</option>
                        </select>
                    </div>
                    
                    <!-- Q5: Charging Point Access (Filter) -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">5. Do you have access to a charging point?</label>
                        <div class="space-y-2 mt-2">
                            <label class="flex items-center">
                                <input type="checkbox" name="chargingAccess" value="At home" class="h-4 w-4 text-red-600 border-gray-300 rounded focus:ring-red-500">
                                <span class="ml-3 text-sm text-gray-600">At home</span>
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" name="chargingAccess" value="At work" class="h-4 w-4 text-red-600 border-gray-300 rounded focus:ring-red-500">
                                <span class="ml-3 text-sm text-gray-600">At work</span>
                            </label>
                             <label class="flex items-center">
                                <input type="checkbox" name="chargingAccess" value="Not currently but I could install at home" class="h-4 w-4 text-red-600 border-gray-300 rounded focus:ring-red-500">
                                <span class="ml-3 text-sm text-gray-600">Not currently, but I could install at home</span>
                            </label>
                             <label class="flex items-center">
                                <input type="checkbox" name="chargingAccess" value="No" class="h-4 w-4 text-red-600 border-gray-300 rounded focus:ring-red-500">
                                <span class="ml-3 text-sm text-gray-600">No</span>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="w-full primary-btn text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:shadow-lg mt-4">
                        Find My Perfect Match
                    </button>
                </form>
            </div>

            <!-- Results Panel -->
            <div id="results" class="card p-6 md:p-8">
                
                <div id="results-container" class="space-y-4">
                    <p class="text-gray-500 text-center py-4">Complete the questionnaire to see your recommendations.</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const CAR_MODELS = [
            { "name": "Clio", "vibe": "Small (ideal for 1-2, big enough for 4)", "longDistanceFrequency": "Weekly", "prioritise": "The essentials, done right", "drivingDay": "Light driving here and there", "chargingAccess": ["No"], "isElectric": false, "description": "Compact and efficient city car (Petrol/Hybrid)." },
            { "name": "R5 e-Tech Electric", "vibe": "Small (ideal for 1-2, big enough for 4)", "longDistanceFrequency": "Rarely", "prioritise": "Design that stands out", "drivingDay": "City commutes and short trips", "chargingAccess": ["At work", "Not currently but I could install at home", "At home"], "isElectric": true, "description": "Fun, electric hatchback with bold design." },
            { "name": "R4 e-Tech Electric", "vibe": "Mid-sized (ideal for 1-4, big enough for 5)", "longDistanceFrequency": "Rarely", "prioritise": "Design that stands out", "drivingDay": "City commutes and short trips", "chargingAccess": ["At work", "Not currently but I could install at home", "At home"], "isElectric": true, "description": "Rugged electric crossover." },
            { "name": "Captur", "vibe": "Mid-sized (ideal for 1-4, big enough for 5)", "longDistanceFrequency": "Daily", "prioritise": "The essentials, done right", "drivingDay": "Always on-the-go with kids", "chargingAccess": ["No"], "isElectric": false, "description": "Small SUV, versatile and connected (Hybrid/Petrol)." },
            { "name": "Symbioz", "vibe": "Mid-sized (ideal for 1-4, big enough for 5)", "longDistanceFrequency": "Daily", "prioritise": "Design that stands out", "drivingDay": "Light driving here and there", "chargingAccess": ["No"], "isElectric": false, "description": "Mid-sized family SUV (Hybrid/Petrol)." },
            { "name": "Megane", "vibe": "Mid-sized (ideal for 1-4, big enough for 5)", "longDistanceFrequency": "Rarely", "prioritise": "Comfort and space", "drivingDay": "Light driving here and there", "chargingAccess": ["At work", "Not currently but I could install at home", "At home"], "isElectric": true, "description": "Sporty electric hatchback." },
            { "name": "Scenic", "vibe": "Large (comfortably seats 5)", "longDistanceFrequency": "Daily", "prioritise": "Features and modern tech", "drivingDay": "Always on-the-go with kids", "chargingAccess": ["At work", "Not currently but I could install at home", "At home"], "isElectric": true, "description": "Large, electric family SUV." },
            { "name": "Rafale", "vibe": "Large (comfortably seats 5)", "longDistanceFrequency": "Daily", "prioritise": "Design that stands out", "drivingDay": "High mileage motorway driving", "chargingAccess": ["No"], "isElectric": false, "description": "Coupe SUV with focus on design (Hybrid/Petrol)." },
            { "name": "Austral", "vibe": "Large (comfortably seats 5)", "longDistanceFrequency": "Daily", "prioritise": "Comfort and space", "drivingDay": "High mileage motorway driving", "chargingAccess": ["No"], "isElectric": false, "description": "Premium SUV with hybrid technology." }
        ];

        document.getElementById('car-quiz-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const form = e.target;
            const userInput = {
                vibe: form.elements.vibe.value,
                longDistanceFrequency: form.elements.longDistanceFrequency.value,
                prioritise: form.elements.prioritise.value,
                drivingDay: form.elements.drivingDay.value,
                chargingAccess: Array.from(form.elements.chargingAccess).filter(cb => cb.checked).map(cb => cb.value)
            };
            const results = calculateScore(userInput);
            renderResults(results, userInput);
        });

        const chargingAccessCheckboxes = document.querySelectorAll('input[name="chargingAccess"]');
        const chargingAccessNoneCheckbox = document.querySelector('input[name="chargingAccess"][value="No"]');
        chargingAccessCheckboxes.forEach(checkbox => {
            checkbox.addEventListener('change', () => {
                if (checkbox.value === 'No' && checkbox.checked) {
                    chargingAccessCheckboxes.forEach(cb => {
                        if (cb.value !== 'No') {
                            cb.checked = false;
                            cb.disabled = true;
                        }
                    });
                } else if (checkbox.value !== 'No' && checkbox.checked) {
                    chargingAccessNoneCheckbox.checked = false;
                    chargingAccessCheckboxes.forEach(cb => { cb.disabled = false; });
                } else if (document.querySelectorAll('input[name="chargingAccess"]:checked').length === 0) {
                    chargingAccessCheckboxes.forEach(cb => { cb.disabled = false; });
                }
            });
        });

        function calculateScore(userInput) {
            return CAR_MODELS.map(model => {
                let isFiltered = false;
                let breakdown = {};

                // Vibe Filter
                if (userInput.vibe && model.vibe !== userInput.vibe) {
                    isFiltered = true;
                    breakdown.vibe = { matched: false, text: `Mismatched size: User wants ${userInput.vibe}` };
                } else {
                    breakdown.vibe = { matched: true, text: `Matched size` };
                }
                
                // Charging Access Filter
                const userWantsNoCharging = userInput.chargingAccess.includes("No");
                const userWantsCharging = userInput.chargingAccess.some(opt => opt !== "No");

                if (userWantsNoCharging && model.isElectric) {
                    isFiltered = true;
                    breakdown.charging = { matched: false, text: `Charging: EV not suitable as user has no charging access` };
                } else if (userWantsCharging && model.isElectric) {
                    const hasChargingMatch = userInput.chargingAccess.some(opt => model.chargingAccess.includes(opt));
                    if (!hasChargingMatch) {
                        isFiltered = true;
                        breakdown.charging = { matched: false, text: `Charging: User charging options do not match model's requirements` };
                    } else {
                        breakdown.charging = { matched: true, text: `Charging: Charging access compatible` };
                    }
                } else {
                    breakdown.charging = { matched: true, text: `Charging: Compatible` };
                }


                if (isFiltered) {
                    return { model: model.name, score: -1, isFiltered: true, description: model.description, breakdown };
                }
                
                let score = 0;
                if (model.longDistanceFrequency === userInput.longDistanceFrequency) {
                    score += 2;
                    breakdown.distance = { matched: true, text: `Distance Freq. (2x): Matched frequency: "${userInput.longDistanceFrequency}" (+2 pts)` };
                } else {
                    breakdown.distance = { matched: false, text: `Distance Freq. (2x): Mismatched frequency: User wants "${userInput.longDistanceFrequency}" (+0 pts)` };
                }

                if (model.prioritise === userInput.prioritise) {
                    score += 3;
                    breakdown.prioritise = { matched: true, text: `Prioritise (3x): Matched priority: "${userInput.prioritise}" (+3 pts)` };
                } else {
                    breakdown.prioritise = { matched: false, text: `Prioritise (3x): Mismatched priority: User wants "${userInput.prioritise}" (+0 pts)` };
                }

                if (model.drivingDay === userInput.drivingDay) {
                    score += 1;
                    breakdown.drivingDay = { matched: true, text: `Driving Day (1x): Matched driving day: "${userInput.drivingDay}" (+1 pt)` };
                } else {
                    breakdown.drivingDay = { matched: false, text: `Driving Day (1x): Mismatched driving day: User wants "${userInput.drivingDay}" (+0 pts)` };
                }
                
                return { model: model.name, score, isFiltered: false, description: model.description, breakdown };
            }).sort((a, b) => b.score - a.score);
        }

        function renderResults(results, userInput) {
            const container = document.getElementById('results-container');
            container.innerHTML = '';
            const passedModels = results.filter(r => !r.isFiltered);
            const filteredModels = results.filter(r => r.isFiltered);

            if (passedModels.length === 0) {
                container.innerHTML = `<div class="text-center p-6 bg-red-50 rounded-lg border border-red-200">
                        <p class="font-semibold text-red-700">No models passed the essential filters.</p>
                        <p class="text-sm text-red-600 mt-1">Please adjust your filter options.</p>
                    </div>`;
            } else {
                container.innerHTML += '<h2 class="text-2xl font-bold mb-6 text-gray-700">Recommended Models</h2>';
                passedModels.forEach((result, index) => {
                    container.innerHTML += createModelCard(result, index + 1, userInput);
                });
            }

            if (filteredModels.length > 0) {
                container.innerHTML += `<h3 class="text-xl font-semibold text-gray-700 mt-6 mb-3 border-b pb-2">Filtered Out Models</h3>`;
                filteredModels.forEach(result => {
                    container.innerHTML += createFilteredCard(result);
                });
            }
        }

        function createModelCard(result, rank, userInput) {
            const totalScore = 6;
            const percentage = result.score > 0 ? ((result.score / totalScore) * 100).toFixed(0) : 0;
            const breakdownHTML = `
                <div class="mt-4 pt-4 border-t border-gray-200">
                    <p class="flex items-center text-sm font-semibold text-gray-600 cursor-pointer" onclick="toggleBreakdown(this)">
                        <svg class="w-4 h-4 mr-2 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        View Detailed Scoring Breakdown
                    </p>
                    <div class="hidden mt-3 pl-6 space-y-2 text-xs">
                        ${result.breakdown.vibe ? `<p class="${result.breakdown.vibe.matched ? 'text-green-600' : 'text-red-600'}">${result.breakdown.vibe.matched ? '✓' : '✗'} Vibe: ${result.breakdown.vibe.text}</p>` : ''}
                        ${result.breakdown.charging ? `<p class="${result.breakdown.charging.matched ? 'text-green-600' : 'text-red-600'}">${result.breakdown.charging.matched ? '✓' : '✗'} ${result.breakdown.charging.text}</p>` : ''}
                        ${result.breakdown.distance ? `<p class="${result.breakdown.distance.matched ? 'text-green-600' : 'text-red-600'}">${result.breakdown.distance.matched ? '✓' : '✗'} ${result.breakdown.distance.text}</p>` : ''}
                        ${result.breakdown.prioritise ? `<p class="${result.breakdown.prioritise.matched ? 'text-green-600' : 'text-red-600'}">${result.breakdown.prioritise.matched ? '✓' : '✗'} ${result.breakdown.prioritise.text}</p>` : ''}
                        ${result.breakdown.drivingDay ? `<p class="${result.breakdown.drivingDay.matched ? 'text-green-600' : 'text-red-600'}">${result.breakdown.drivingDay.matched ? '✓' : '✗'} ${result.breakdown.drivingDay.text}</p>` : ''}
                    </div>
                </div>
            `;

            return `<div class="p-4 border border-gray-200 rounded-lg bg-white">
                    <div class="flex items-start">
                        <span class="text-lg font-bold w-6 h-6 flex items-center justify-center rounded-full ${rank === 1 ? 'bg-yellow-400 text-gray-800' : 'bg-gray-100 text-gray-600'}">${rank}</span>
                        <div class="ml-4 flex-grow">
                            <div class="flex justify-between items-center">
                                <h4 class="text-xl font-extrabold text-gray-800">${result.model}</h4>
                                <div class="text-2xl font-bold text-red-600">${result.score} pts</div>
                            </div>
                            <span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-green-100 text-green-800">${percentage}% Match</span>
                            <p class="text-sm text-gray-500 mt-2">${result.description}</p>
                        </div>
                    </div>
                    ${breakdownHTML}
                </div>`;
        }

        function createFilteredCard(result) {
            return `<div class="p-3 border-l-4 border-red-400 rounded-lg bg-red-50 flex justify-between items-center">
                    <div>
                        <h4 class="text-lg font-semibold text-red-800">${result.model}</h4>
                        <p class="text-xs text-red-600 mt-0.5">Doesn't match your filter criteria.</p>
                    </div>
                    <span class="text-sm font-medium text-red-500">Excluded</span>
                </div>`;
        }

        function toggleBreakdown(element) {
            const breakdown = element.nextElementSibling;
            const icon = element.firstElementChild;
            breakdown.classList.toggle('hidden');
            icon.classList.toggle('rotate-180');
        }

    </script>
</body>
</html>
